<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/success.css" />
  <script type="module" src="assets/js/main.js" defer></script>
  <script type="module" src="assets/js/success.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="success-container">
    <div class="success-card">
      <div class="checkmark-container">...</div>
      <h1 data-i18n="succ_h1">Booking Received!</h1>
      <p class="subtitle" data-i18n="succ_sub">Thank you...</p>
      <div class="booking-ref-box">
        <p data-i18n="succ_ref">Booking Number</p>
        <h2 id="booking-id">#XXXXXX</h2>
      </div>
      <div class="summary-container">
        <h3 data-i18n="succ_sum_h3">Reservation Summary</h3>
        <div class="summary-item"><span class="label" data-i18n="sum_name">Name</span><span class="value" id="sum-name">-</span></div>
        <div class="summary-item"><span class="label" data-i18n="sum_LicNum">License Number</span><span class="value" id="sum-LicNum">-</span></div>
        <div class="summary-item"><span class="label" data-i18n="sum_location">Location</span><span class="value" id="sum-location">-</span></div>
        <div class="summary-item"><span class="label" data-i18n="sum_car">Car Model</span><span class="value" id="sum-car">-</span></div>
        <div class="summary-item"><span class="label" data-i18n="sum_date">Pick-up Date</span><span class="value" id="sum-date">-</span></div>
        <div class="summary-item"><span class="label" data-i18n="sum_total">Total Amount</span><span class="value highlight" id="sum-cost">-</span></div>
      </div>
      <a href="index.html" class="btn-primary full-width" data-i18n="btn_home">Return to Homepage</a>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
