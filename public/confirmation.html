<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="conf_h1">Confirm Booking - 26 Ride Rental</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/confirmation.css" />
  <script type="module" src="assets/js/main.js" defer></script>
  <script type="module" src="assets/js/confirmation.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="confirmation-container">
    <div class="confirmation-card">
      <h1 data-i18n="conf_h1">Confirm Your Reservation</h1>
      <p class="subtitle" data-i18n="conf_sub">Please review your details and agree to the terms below.</p>
      <section id="summary-container" class="summary-box"></section>
      <h3 data-i18n="rules_h3">Important Rental Rules</h3>
      <article class="rules-box">
        <div class="compact-rules">
          <div class="rule-item"><i class="fas fa-clock"></i><span data-i18n="rule_time">Timing...</span></div>
          <div class="rule-item"><i class="fas fa-shield-alt"></i><span data-i18n="rule_ins">Insurance...</span></div>
          <div class="rule-item"><i class="fas fa-ban"></i><span data-i18n="rule_odor">No Odors...</span></div>
          <div class="rule-item"><i class="fas fa-gas-pump"></i><span data-i18n="rule_gas">Fuel...</span></div>
          <div class="rule-item"><i class="fas fa-phone-alt"></i><span data-i18n="rule_emg">Emergency...</span></div>
        </div>
        <a href="terms.html" target="_blank" class="read-more-btn"><span data-i18n="read_full">Read Full Terms</span> <i class="fas fa-arrow-right"></i></a>
      </article>
      <div class="agreement-section">
        <label class="checkbox-label">
          <input type="checkbox" id="agree"> 
          <span data-i18n="agree_check">I agree to the terms and conditions</span>
        </label>
      </div>
      <div class="confirmation-buttons">
        <button id="back-btn" class="btn-secondary" data-i18n="btn_back">Back & Edit</button>
        <button id="proceed-btn" class="btn-primary full-width" data-i18n="btn_pay">Proceed to Payment</button>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
