<head>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/confirmation.css" />
  <script type="module" src="assets/js/confirmation.js" defer></script>
</head>

<body>
  <div id="site-header"></div>

  <main class="confirmation-container">
    <div class="confirmation-card">
      <h1>Confirm Your Reservation</h1>
      <p class="subtitle">Please review your details and agree to the terms below.</p>

      <section id="summary-container" class="summary-box">
        </section>

      <h3>Cautions & Rules</h3>
      <article class="rules-box">
        <ul>
          <li>Please bring your valid driver’s license.</li>
          <li>Cars must be returned with the same fuel level.</li>
          <li>No smoking or pets inside the vehicle.</li>
          <li>Any damage must be reported immediately.</li>
        </ul>
      </article>

      <div class="agreement-section">
        <label class="checkbox-label">
          <input type="checkbox" id="agree"> 
          <span>I agree to the terms and conditions</span>
        </label>
      </div>

      <div class="confirmation-buttons">
        <button id="back-btn" class="btn-secondary">Back & Edit</button>
        <button id="proceed-btn" class="btn-primary full-width" disabled>Proceed to Payment</button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
