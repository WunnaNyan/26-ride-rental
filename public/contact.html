<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - 26 Ride Rental</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/contact.css">

  <script type="module" src="assets/js/main.js" defer></script>
</head>

<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <h1>Contact Us</h1>
    <p>We’re ready to assist you</p>
  </section>

  <section class="contact-section">
    <div class="contact-grid">
      <div class="contact-box">
        <h3>Facebook</h3>
        <p>26 cm</p>
      </div>
      <div class="contact-box">
        <h3>Email</h3>
        <p>kinmaru@barnyar.com</p>
      </div>
      <div class="contact-box">
        <h3>Phone</h3>
        <p>080 7843 2341</p>
      </div>
      <div class="contact-box">
        <h3>Operating Hours</h3>
        <p>Mon – Sun<br>9:00 AM – 8:00 PM</p>
      </div>
    </div>
  </section>

  <section class="contact-section light">
    <h2>Pickup Locations (Tokyo)</h2>
    <div class="map-container">
      <iframe
        src="https://www.google.com/maps?q=Tokyo&output=embed"
        loading="lazy">
      </iframe>
    </div>
  </section>

  <div id="site-footer"></div>
</body>
</html>
