<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Fleet - 26 Ride Rental</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/cars.css">
  <script type="module" src="assets/js/main.js" defer></script>
</head>

<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="fleet_title">Our Premium Fleet</h1>
        <p data-i18n="fleet_subtitle">Reliable, clean, and expertly maintained vehicles for your Tokyo journey.</p>
      </div>
    </section>

    <section class="car-listing">
      <div class="container">
        <span class="section-label" data-i18n="fleet_selection">Fleet Selection</span>
        <h2 class="listing-title" data-i18n="available_vehicles">Available Vehicles</h2>

        <div id="dynamic-car-list">
             </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    window.changeMainImage = function(carId, imgUrl) {
      const mainImg = document.getElementById(`main-${carId}`);
      if (mainImg) mainImg.src = imgUrl;
    }
  </script>
</body>
</html>
