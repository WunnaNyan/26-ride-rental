<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Active 26</title>
    <link rel="stylesheet" href="assets/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="assets/js/login.js" defer></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>ACTIVE <span>26</span></h1>
                <p>Administrative Access Portal</p>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <label>Admin Email</label>
                    <input type="email" id="email" placeholder="admin@active26.com" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="toggle-password" class="toggle-btn">Show</button>
                    </div>
                </div>
                
                <button type="submit" class="btn-login">Sign In to Dashboard</button>
            </form>
            
            <footer class="auth-footer">
                <p>Authorized personnel only. Activities are logged.</p>
            </footer>
        </div>
    </div>
</body>
</html>
