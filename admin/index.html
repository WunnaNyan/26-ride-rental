<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | Active 26 Car Rental</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <script type="module" src="assets/js/login.js" defer></script>
</head>
<body>
    <div class="container" style="margin-top: 100px; max-width: 400px;">
        <div class="cta-card">
            <h2>Admin Login</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="Admin Email" required style="width:100%; padding:10px; margin:10px 0;">
                <input type="password" id="password" placeholder="Password" required style="width:100%; padding:10px; margin:10px 0;">
                <button type="submit" class="btn-primary" style="width:100%;">Login to Dashboard</button>
            </form>
        </div>
    </div>
</body>
</html>
